[defaults]
inventory            = inventory/hosts.ini
forks                = 50
timeout              = 30
interpreter_python   = auto_silent
stdout_callback      = yaml
callbacks_enabled    = profile_tasks, timer
deprecation_warnings = False
log_path             = ./ansible.log

# Simpan daftar host yang gagal -> ulangi dengan --limit @retry/quick.retry
retry_files_enabled   = True
retry_files_save_path = ./retry

# Biarkan True. Verifikasi host key TETAP aktif; perilaku untuk host baru diatur
# oleh StrictHostKeyChecking=accept-new di [ssh_connection] ssh_args di bawah:
#   - host BARU        -> key otomatis disimpan ke known_hosts, koneksi lanjut
#   - host DIKENAL     -> kalau key BERUBAH, koneksi DITOLAK (proteksi MITM)
# Set False hanya kalau terpaksa: itu memaksa StrictHostKeyChecking=no, yang
# ikut menerima host key yang berubah -> proteksi MITM hilang total.
host_key_checking = True

[privilege_escalation]
become        = False
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
# ControlPersist = 1 koneksi SSH dipakai ulang antar task -> jauh lebih cepat
# IdentitiesOnly=yes -> ssh HANYA memakai key dari ansible_ssh_private_key_file.
# Tanpa ini, ssh mencoba semua key di ~/.ssh + ssh-agent satu per satu dan bisa
# kena 'Too many authentication failures' (MaxAuthTries server default 6).
ssh_args    = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o GSSAPIAuthentication=no
pipelining  = True
retries     = 2
scp_if_ssh  = smart
